name: Publish to npm

on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write

concurrency:
  group: npm-publish-${{ github.event.release.tag_name }}
  cancel-in-progress: false

jobs:
  publish:
    name: Publish ${{ github.event.release.tag_name }}
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out release tag
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.release.tag_name }}

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          registry-url: https://registry.npmjs.org/
          package-manager-cache: false

      - name: Verify release version
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          PACKAGE_VERSION="$(node -p "require('./package.json').version")"
          if [ "$RELEASE_TAG" != "$PACKAGE_VERSION" ] && [ "$RELEASE_TAG" != "v$PACKAGE_VERSION" ]; then
            echo "Release tag '$RELEASE_TAG' does not match package version '$PACKAGE_VERSION'." >&2
            exit 1
          fi

      - name: Select npm distribution tag
        id: dist-tag
        env:
          IS_PRERELEASE: ${{ github.event.release.prerelease }}
        run: |
          if [ "$IS_PRERELEASE" = "true" ]; then
            echo "name=next" >> "$GITHUB_OUTPUT"
          else
            echo "name=latest" >> "$GITHUB_OUTPUT"
          fi

      - name: Check npm registry
        id: registry
        env:
          DIST_TAG: ${{ steps.dist-tag.outputs.name }}
        run: |
          PACKAGE_NAME="$(node -p "require('./package.json').name")"
          PACKAGE_VERSION="$(node -p "require('./package.json').version")"
          set +e
          VIEW_OUTPUT="$(npm view "$PACKAGE_NAME@$PACKAGE_VERSION" version --registry=https://registry.npmjs.org/ 2>&1)"
          VIEW_STATUS=$?
          set -e

          if [ "$VIEW_STATUS" -eq 0 ]; then
            TAGGED_VERSION="$(npm view "$PACKAGE_NAME" "dist-tags.$DIST_TAG" --registry=https://registry.npmjs.org/)"
            if [ "$TAGGED_VERSION" != "$PACKAGE_VERSION" ]; then
              echo "$PACKAGE_NAME@$PACKAGE_VERSION already exists, but '$DIST_TAG' points to '$TAGGED_VERSION'." >&2
              exit 1
            fi
            echo "published=true" >> "$GITHUB_OUTPUT"
            echo "$PACKAGE_NAME@$PACKAGE_VERSION is already published with tag '$DIST_TAG'; skipping duplicate publish."
          elif printf '%s' "$VIEW_OUTPUT" | grep -q 'E404'; then
            echo "published=false" >> "$GITHUB_OUTPUT"
          else
            printf '%s\n' "$VIEW_OUTPUT" >&2
            exit "$VIEW_STATUS"
          fi

      - name: Install dependencies
        if: steps.registry.outputs.published != 'true'
        run: npm ci

      - name: Publish package
        if: steps.registry.outputs.published != 'true'
        run: npm publish --access public --provenance --tag "${{ steps.dist-tag.outputs.name }}"
